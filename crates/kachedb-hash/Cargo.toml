[package]
name        = "kachedb-hash"
version     = "0.3.2"
edition     = "2024"
description = "KacheDB SIMD-accelerated Swiss Table O(1) hash index"
license     = "Apache-2.0 OR MIT"

[dependencies]
kachedb-core = { path = "../kachedb-core" }
ahash        = { workspace = true }
log          = { workspace = true }
thiserror    = { workspace = true }
cfg-if       = { workspace = true }
parking_lot  = { workspace = true }
smallvec     = { workspace = true }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[[bench]]
name    = "swiss_table"
harness = false

[dev-dependencies]
criterion = { workspace = true }
