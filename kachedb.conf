# ==============================================================================
# KacheDB Canonical Configuration File (v0.3.1)
# ==============================================================================
# Note on units: Memory is specified in Megabytes (MB) unless noted otherwise.

################################## NETWORK #####################################

# By default, if no "bind" configuration directive is specified, KacheDB listens
# for connections from all available network interfaces on the server.
# You can listen to just one or multiple interfaces using the bind directive.
#
# Examples:
# bind 127.0.0.1
# bind 0.0.0.0
bind 0.0.0.0

# Accept connections on the specified port, default is 6379 (compatible with Redis clients).
# If port 0 is specified, KacheDB will not listen on a TCP socket.
port 6379

# Set the maximum number of simultaneously connected clients.
# By default this limit is set to 10000 clients. When the limit is reached, KacheDB
# will close new connections and return an error: "-ERR max number of clients reached\r\n".
maxclients 10000

################################## WORKERS #####################################

# Number of event loop worker threads.
# Setting to 0 enables automatic detection based on available CPU cores.
# Each worker pins to an isolated hardware core using core_affinity and operates
# on its own memory partition with zero cross-core cache invalidation.
workers 0

# Size of the per-core memory pool in Megabytes.
# Default is 64 MB per worker core (allowing diverse slab size classes and high throughput).
pool-mb 64

############################# SHARED MEMORY (SHM) #############################

# Enable ultra-low-latency IPC via POSIX shared memory ring buffers.
# Allows local clients (e.g., Python/Rust microservices on the same host)
# to achieve 0.8µs latency and 3.4M ops/sec, completely bypassing TCP/IP stack.
# Values: yes | no
shm yes

################################ PERSISTENCE ###################################

# ----------------------------- Binary Snapshotting ----------------------------
# Point-in-time zero-lock snapshot persistence for vector indexes and KV store.
# Automatically hydrates state on startup before AOF replay.
# Values: yes | no (default: yes)
snapshot yes

# The filename or absolute path of the binary snapshot file.
# Default is stored in the current working directory as "dump.kdb".
dbfilename dump.kdb

# Interval (in seconds) between automatic background snapshots.
# Default: 300 (every 5 minutes)
snapshot-interval 300

# --------------------- Snapshot Encryption-at-Rest ----------------------------
# Hardware-accelerated authenticated streaming encryption for dump.kdb.
# In-memory operations remain 100% plaintext; encryption occurs strictly out-of-band
# during background snapshot file writing.
# Values: yes | no (default: no)
# snapshot-encryption no

# Symmetric AEAD cipher suite:
#   aes-256-gcm:       Hardware-accelerated AES-NI / ARM Cryptography Extensions (default)
#   chacha20-poly1305: Pure software streaming AEAD fallback
# snapshot-encryption-cipher aes-256-gcm

# Encryption key passphrase (automatically derived with HKDF-SHA256 and unique 32-byte salt)
# or 64-character hexadecimal raw 256-bit key:
# snapshot-encryption-key "your_secret_passphrase_here"

# Path to 32-byte raw binary master key file (overrides snapshot-encryption-key if specified):
# snapshot-encryption-key-file /etc/kachedb/snapshot.key

# ---------------------------- Append-Only File (AOF) --------------------------
# By default, KacheDB operates as an ultra-fast in-memory cache with snapshots.
# Enable Append-Only File (AOF) persistence for ACID durability.
# Values: yes | no
appendonly no

# The name of the append-only file (stored in current working directory unless path provided).
appendfilename kachedb.aof

# The fsync() call tells the Operating System to actually write data on disk
# instead of waiting for more data in the output buffer.
# KacheDB supports three modes:
#
#   no:       Don't fsync, just let the OS flush data when it wants. Fastest (sub-microsecond).
#   always:   fsync after every single write transaction. Safest, but slowest disk I/O.
#   everysec: fsync every second. A compromise between speed and safety (default).
appendfsync everysec

################################## SECURITY ####################################

# Require clients to authenticate with a password before executing any other commands.
# WARNING: Since KacheDB can process millions of queries per second, make sure
# to use a strong, long password (at least 32 characters recommended).
#
# requirepass "your_strong_secret_password_here"

################################### TLS / SSL ##################################

# Enable TLS encryption for secure client connections.
# Both tls-cert and tls-key must be specified to enable TLS.
#
# tls-cert /etc/kachedb/tls/server.crt
# tls-key /etc/kachedb/tls/server.key
# tls-ca /etc/kachedb/tls/ca.crt
