<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Slab Column Gradient (Electric Cyan) -->
    <linearGradient id="slabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Radix / Token Branch Gradient (Cyan to Indigo) -->
    <linearGradient id="branchGradTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    
    <!-- S3-FIFO / Stream Branch Gradient (Amber to Red) -->
    <linearGradient id="branchGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .brand-title {
        fill: #0F172A;
      }
      .brand-db {
        fill: #0284C7;
      }
      .brand-subtitle {
        fill: #475569;
      }
      .badge-bg {
        fill: #0F172A;
        stroke: #CBD5E1;
      }
      .badge-text {
        fill: #F8FAFC;
      }

      @media (prefers-color-scheme: dark) {
        .brand-title {
          fill: #F8FAFC;
        }
        .brand-db {
          fill: #38BDF8;
        }
        .brand-subtitle {
          fill: #94A3B8;
        }
        .badge-bg {
          fill: #1E293B;
          stroke: #334155;
        }
        .badge-text {
          fill: #E2E8F0;
        }
      }
    </style>
  </defs>

  <!-- ==================== LOGO ICON (Stylized 'K') ==================== -->
  <g transform="translate(60, 35)">
    <!-- Glow Effect Backing -->
    <g filter="url(#glow)" opacity="0.4">
      <rect x="15" y="15" width="26" height="34" rx="6" fill="#38BDF8"/>
      <rect x="15" y="58" width="26" height="34" rx="6" fill="#0284C7"/>
      <rect x="15" y="101" width="26" height="34" rx="6" fill="#0369A1"/>
      <path d="M 52 75 L 105 22 L 132 22 L 72 82 Z" fill="#6366F1"/>
      <path d="M 52 75 L 72 68 L 132 128 L 105 128 Z" fill="#F59E0B"/>
    </g>

    <!-- Left Vertical Pillar: 3 Memory Megaslab Blocks -->
    <rect x="15" y="15" width="26" height="34" rx="6" fill="url(#slabGrad)"/>
    <rect x="15" y="58" width="26" height="34" rx="6" fill="url(#slabGrad)"/>
    <rect x="15" y="101" width="26" height="34" rx="6" fill="url(#slabGrad)"/>

    <!-- Memory Alignment Indicators (64-byte Cache Lines) -->
    <line x1="20" y1="32" x2="36" y2="32" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="75" x2="36" y2="75" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="118" x2="36" y2="118" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Branch 1: Top Upper Shard (Radix Prefix Tree Branch) -->
    <path d="M 50 68 L 102 16 L 130 16 L 70 76 Z" fill="url(#branchGradTop)"/>
    
    <!-- Token Prefix Tree Node Points -->
    <circle cx="116" cy="16" r="4.5" fill="#A5B4FC"/>
    <circle cx="60" cy="72" r="3.5" fill="#38BDF8"/>

    <!-- Right Branch 2: Bottom Shard (S3-FIFO & Zero-Copy Tensor Stream) -->
    <path d="M 50 82 L 70 74 L 130 134 L 102 134 Z" fill="url(#branchGradBottom)"/>
    
    <!-- Eviction / Cache Hit Connector Node -->
    <circle cx="116" cy="134" r="4.5" fill="#FDE68A"/>
  </g>

  <!-- ==================== LOGO TEXT & TYPOGRAPHY ==================== -->
  <!-- Wordmark: KacheDB -->
  <text x="240" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-weight="800" font-size="64" letter-spacing="-1.5">
    <tspan class="brand-title">Kache</tspan><tspan class="brand-db">DB</tspan>
  </text>

  <!-- High-Tech Descriptor / Subtitle -->
  <text x="245" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', sans-serif" font-weight="600" font-size="14" class="brand-subtitle" letter-spacing="2.5">
    ZERO-COPY IN-MEMORY CACHE &amp; LLM KV-ENGINE
  </text>

  <!-- Status / Engine Badge -->
  <g transform="translate(680, 80)">
    <rect width="90" height="26" rx="13" class="badge-bg" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17" font-family="sans-serif" font-size="11" font-weight="700" class="badge-text" letter-spacing="0.8">RUST</text>
  </g>
</svg>
