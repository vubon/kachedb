<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Slab Column Gradient (Electric Cyan) -->
    <linearGradient id="logoSlabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Radix / Token Branch Gradient (Cyan to Indigo) -->
    <linearGradient id="logoBranchGradTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    
    <!-- S3-FIFO / Stream Branch Gradient (Amber to Red) -->
    <linearGradient id="logoBranchGradBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== STANDALONE LOGO MARK ('K') ==================== -->
  <g transform="translate(8, 6)">
    <!-- Glow Effect Backing -->
    <g filter="url(#logoGlow)" opacity="0.45">
      <rect x="15" y="15" width="26" height="34" rx="6" fill="#38BDF8"/>
      <rect x="15" y="58" width="26" height="34" rx="6" fill="#0284C7"/>
      <rect x="15" y="101" width="26" height="34" rx="6" fill="#0369A1"/>
      <path d="M 52 75 L 105 22 L 132 22 L 72 82 Z" fill="#6366F1"/>
      <path d="M 52 75 L 72 68 L 132 128 L 105 128 Z" fill="#F59E0B"/>
    </g>

    <!-- Left Vertical Pillar: 3 Memory Megaslab Blocks -->
    <rect x="15" y="15" width="26" height="34" rx="6" fill="url(#logoSlabGrad)"/>
    <rect x="15" y="58" width="26" height="34" rx="6" fill="url(#logoSlabGrad)"/>
    <rect x="15" y="101" width="26" height="34" rx="6" fill="url(#logoSlabGrad)"/>

    <!-- Memory Alignment Indicators (64-byte Cache Lines) -->
    <line x1="20" y1="32" x2="36" y2="32" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="75" x2="36" y2="75" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="118" x2="36" y2="118" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Branch 1: Top Upper Shard (Radix Prefix Tree Branch) -->
    <path d="M 50 68 L 102 16 L 130 16 L 70 76 Z" fill="url(#logoBranchGradTop)"/>
    
    <!-- Token Prefix Tree Node Points -->
    <circle cx="116" cy="16" r="4.5" fill="#A5B4FC"/>
    <circle cx="60" cy="72" r="3.5" fill="#38BDF8"/>

    <!-- Right Branch 2: Bottom Shard (S3-FIFO & Zero-Copy Tensor Stream) -->
    <path d="M 50 82 L 70 74 L 130 134 L 102 134 Z" fill="url(#logoBranchGradBottom)"/>
    
    <!-- Eviction / Cache Hit Connector Node -->
    <circle cx="116" cy="134" r="4.5" fill="#FDE68A"/>
  </g>
</svg>
