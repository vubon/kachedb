[book]
authors = ["Vubon Roy <vubon.roy@gmail.com>"]
language = "en"
src = "docs"
title = "KacheDB Documentation"

[output.html]
site-url = "/kachedb/"
git-repository-url = "https://github.com/vubon/kachedb"
edit-url-template = "https://github.com/vubon/kachedb/edit/main/{path}"
theme = "theme"
default-theme = "rust"
preferred-dark-theme = "navy"
mathjax-support = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
