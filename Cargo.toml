[workspace]
members = [
    "crates/kachedb-core",
    "crates/kachedb-hash",
    "crates/kachedb-radix",
    "crates/kachedb-shm",
    "crates/kachedb-net",
    "crates/kachedb-proto-resp",
    "crates/kachedb-proto-tensor",
    "crates/kachedb-server",
    "crates/kachedb-cli",
    "crates/kachedb-bench",
]
resolver = "2"

# ─────────────────────────────────────────────
# Workspace-wide shared dependencies
# (platform-conditional deps live in each crate's Cargo.toml)
# ─────────────────────────────────────────────
[workspace.dependencies]
smallvec        = "1.13"
crossbeam-utils = "0.8"
log             = "0.4"
thiserror       = "2.0"
cfg-if          = "1.0"
libc            = "0.2"
ahash           = "0.8"
arc-swap        = "1.7"
criterion       = { version = "0.5", features = ["html_reports"] }
io-uring        = "0.7"
core_affinity   = "0.8"
mio             = { version = "1.0", features = ["os-poll", "net"] }
parking_lot     = "0.12"
crossbeam-channel = "0.5"
